name: CI

# Trigger the workflow on push or pull request
on:
  push:
    branches:
      - master
      - main
  pull_request:

# the `concurrency` settings ensure that not too many CI jobs run in parallel
concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the default repository branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # The CI test job
  test:
    name: ${{ matrix.gap-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gap-version:
          - 'devel'   # current GAP development version from git
          - 'latest'  # latest GAP release
          - 'minimal' # oldest GAP release supported by this package

    steps:
      - uses: actions/checkout@v6
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: ${{ matrix.gap-version }}
      - uses: gap-actions/build-pkg@v3
      - uses: gap-actions/run-pkg-tests@v4
      - uses: gap-actions/run-pkg-tests@v4
        with:
          mode: onlyneeded
      - uses: gap-actions/process-coverage@v3
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # These packages call AutPGrp internals (PGOrbitStabilizer,
  # PGHybridOrbitStabilizer, ...), so run their test suites against this
  # AutPGrp to catch breaking them.
  dependents:
    name: 'upstream ${{ matrix.package }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - anupq
          - modisom
          - polycyclic
          - sophus

    steps:
      - uses: actions/checkout@v6
      - name: 'Install PARI/GP'  # for alnuth, needed by polycyclic
        run: |
          sudo apt-get update
          sudo apt-get install pari-gp
      - uses: gap-actions/setup-gap@v3
      - name: 'Replace ${{ matrix.package }} and AutPGrp shipped with GAP'
        env:
          PKG: ${{ matrix.package }}
        run: |
          # setup-gap links this checkout into /tmp/gaproot/pkg
          rm -rf $GAPROOT/pkg/autpgrp* $GAPROOT/pkg/$PKG*
          git clone --depth=1 https://github.com/gap-packages/$PKG $GAPROOT/pkg/$PKG
          cd $GAPROOT/pkg
          ../bin/BuildPackages.sh --strict $PKG
      - name: 'Run ${{ matrix.package }} tests'
        env:
          PKG: ${{ matrix.package }}
        run: |
          # SetPackagePath fails if another AutPGrp is loaded already
          $GAP -c '
            SetPackagePath("autpgrp", "/tmp/gaproot/pkg/autpgrp");
            TestPackage("'$PKG'");
            FORCE_QUIT_GAP(1);  # the TestFile must exit GAP
          '
